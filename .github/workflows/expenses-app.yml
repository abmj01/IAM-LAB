# Lints and tests the Expense Claims app on every change to app/.
# No secrets: the tests use a fake Keycloak and dummy settings.
name: Expenses app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/expenses-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/expenses-app.yml"

# Least privilege: the job can read the code and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      # Actions are pinned to a commit, because a version tag can be moved to other code.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install app and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest
