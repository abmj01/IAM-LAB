[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expenses-app"
version = "0.1.0"
description = "Greenfield expense claims app: Keycloak login (OIDC + PKCE) and a token-protected API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "authlib>=1.9",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15",
    "pydantic-settings>=2.15",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.14",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
include = ["expenses_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
